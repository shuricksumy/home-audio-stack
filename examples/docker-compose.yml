# The whole house in one file.
#
# Music Assistant is the brain; everything else is a room. Two different
# transports are in play, which is worth understanding before you edit anything:
#
#   Squeezelite (SlimProto, port 3483) -- MA's Squeezelite provider drives these.
#                                         Used for the wired USB DACs, because it
#                                         gives bit-perfect output with the DAC
#                                         following the track's own rate.
#   Snapcast    (port 1704)            -- MA's Snapcast provider drives these.
#                                         Used for Bluetooth speakers and LedFx,
#                                         where sample-perfect sync across rooms
#                                         matters more than bit-perfect output.
#
# Three of the services are web panels rather than single players: you create
# and supervise players from a browser instead of adding a service here for each
# output. With host networking they cannot share a port, so:
#
#   http://<host>:8080  squeezelite panel   (wired DACs, bit-perfect)
#   http://<host>:8081  Snapcast panel      (synced rooms)
#   http://<host>:8088  Bluetooth panel     (speakers and headphones)
#
# Copy .env.example to .env first. Every address below comes from there.

networks:
  default:
    driver: bridge
  npm_proxy:
    name: npm_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.112.0.0/24

services:

  # ---------------------------------------------------------------- the brain
  # Host networking is not optional here: MA's built-in Snapserver hands out a
  # port per player in the 4953-5153 range, and mDNS discovery needs the LAN.
  music-assistant-server:
    image: ghcr.io/music-assistant/server:latest
    container_name: music-assistant-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/music-assistant-server:/data
    cap_add:
      - SYS_ADMIN          # for mounting network shares (SMB/NFS music libraries)
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    environment:
      - LOG_LEVEL=info

  # --------------------------------------------- wired DACs, bit-perfect (panel)
  # One container, a web panel on http://<host>:8080, and a player per DAC
  # created from the browser -- no compose entry per output. Squeezelite rather
  # than a Snapcast client here: this is the path that lets the DAC switch rates
  # per track instead of everything being resampled to 48 kHz.
  #
  # In the panel press "Add player" once per DAC. Each player gets its own
  # output (from `pw-cli ls Node | grep node.name`) and its own MAC -- two
  # players sharing a MAC fight over one slot in Music Assistant. The panel
  # generates a unique one if you leave the field blank.
  squeezelite-panel:
    image: ghcr.io/shuricksumy/squeezelite-pipewire:latest
    container_name: squeezelite-panel
    restart: unless-stopped
    network_mode: host                       # SlimProto discovery is broadcast-based
    cap_add: [ SYS_NICE, IPC_LOCK ]          # real-time scheduling for the audio threads
    ulimits:
      rtprio: 95
      memlock: -1
      msgqueue: 8192000
    group_add: [ audio, video ]              # video: shared-memory access on newer PipeWire
    environment:
      - ROLE=panel                           # the image default; stated for clarity
      - PORT=8080                            # host networking: must differ per panel
      - SERVER_IP=${HOST_IP}                 # seeds the Add-player form (MA's SlimProto server)
      - SERVER_PORT=3483
      - ADMIN_USER=admin                     # remove both to leave the panel open on a LAN
      - ADMIN_PASSWORD=${PANEL_PASSWORD}
      - PIPEWIRE_RUNTIME_DIR=/tmp
      - PIPEWIRE_REMOTE=pipewire-0
    volumes:
      # players.json lives here, so the players survive a restart. Create it
      # first or Docker makes it root-owned and the panel cannot write:
      #     mkdir -p data/squeezelite-panel && sudo chown -R ${PUID}:${PUID} data/squeezelite-panel
      - ./data/squeezelite-panel:/config
      - /run/user/${PUID}/pipewire-0:/tmp/pipewire-0
      - /dev/shm:/dev/shm                    # PipeWire's shared-memory transport
    devices:
      # Only for players using the direct-ALSA output. It has to be `devices:`,
      # not a volume -- a volume maps the nodes but the device cgroup still
      # refuses to open them, and squeezelite reports "No such device".
      - /dev/snd:/dev/snd

  # ------------------------------------------------ synced rooms (Snapcast panel)
  # The same idea for Snapcast: one container, a panel, a supervised snapclient
  # per output. Use this for rooms where staying in sync matters more than
  # bit-perfect output -- and give it outputs the squeezelite panel above is not
  # already using. One player per device; see examples/README.md.
  snapcast-panel:
    image: ghcr.io/shuricksumy/snapcast-pipewire:latest
    container_name: snapcast-panel
    restart: unless-stopped
    network_mode: host
    cap_add: [ SYS_NICE, IPC_LOCK ]
    ulimits:
      rtprio: 95
      memlock: -1
      msgqueue: 8192000
    group_add: [ audio, video ]
    environment:
      - ROLE=panel
      - PORT=8081                            # 8080 is taken by the panel above
      - SERVER_IP=${HOST_IP}                 # MA's built-in Snapserver
      - SNAP_PORT=1704                       # stream port
      - SNAP_CONTROL_PORT=1705               # JSON-RPC: now playing, transport, volume
      - SNAP_WEB_PORT=1780                   # Snapweb, for the link on each row
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=${PANEL_PASSWORD}
      - PIPEWIRE_RUNTIME_DIR=/tmp
      - PIPEWIRE_REMOTE=pipewire-0
      - PIPEWIRE_LATENCY=2048/192000         # default for new players
    volumes:
      - ./data/snapcast-panel:/config
      - /run/user/${PUID}/pipewire-0:/tmp/pipewire-0
      - /dev/shm:/dev/shm
    devices:
      - /dev/snd:/dev/snd

  # ------------------------------------------------------- Bluetooth speakers
  # Pair from http://<host>:8088 and each speaker becomes a Snapcast player,
  # supervised inside this one container. No compose entry per speaker.
  bluetooth-web:
    image: ghcr.io/shuricksumy/bluetooth-web-snapclient:latest
    container_name: bluetooth-web
    restart: unless-stopped
    ports:
      - "8088:8080"
    security_opt:
      - apparmor=unconfined                  # Ubuntu: see the note at the bottom
    environment:
      - SNAPSERVER_HOST=${HOST_IP}
      - ADMIN_PASSWORD=${BT_ADMIN_PASSWORD}
    volumes:
      # Bluetooth needs only this one. Read-write: D-Bus is bidirectional and
      # :ro breaks the connection.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      # The three below are for the Snapcast players. Drop them if you only
      # want to pair devices.
      - /run/user/${PUID}/pipewire-0:/tmp/pipewire-0
      - /dev/shm:/dev/shm
      - ./data/bluetooth-web-config:/config  # keeps players.json across updates

  # ---------------------------------------------------------- the light show
  # ROLE=ledfx-suite runs LedFx with both a Snapcast client and a Squeezelite
  # player feeding it, so the strips react whichever transport is playing.
  ledfx:
    image: ghcr.io/shuricksumy/ledfx-snapcast-docker:latest
    container_name: ledfx-pipe
    restart: unless-stopped
    networks:
      npm_proxy:
        ipv4_address: ${IP_LEDFX}
    ports:
      - "8889:8888"                          # LedFx web UI
    user: "${PUID}:${PUID}"
    security_opt:
      - no-new-privileges:true
    environment:
      - ROLE=ledfx-suite
      # Snapcast side
      - SNAP_HOST=${HOST_IP}
      - SNAP_CLIENT_ID=Snap-LedFx
      - SNAPCLIENT_LEDFX_ENABLED=true
      # Squeezelite side
      - SQUEEZELITE_NAME=Squeez-LedFx
      - SQUEEZELITE_SERVER_PORT=${HOST_IP}:3483
      - SQUEEZELITE_MAC=02:00:00:00:1e:d0
      - SQUEEZELITE_EXTRA_ARGS=-W
      - SQUEEZELITE_LEDFX_ENABLED=true
      - STARTUP_DELAY_SEC=5                  # let PulseAudio settle before players start
      - PULSE_LATENCY_MSEC=10
    volumes:
      - ./data/ledfx:/home/ledfx/.ledfx

  # ------------------------------------------------------- optional: DLNA/UPnP
  # Not part of this stack, but it is what makes the setup visible to phones and
  # TVs that only speak UPnP.
  bubbleupnpserver:
    image: bubblesoftapps/bubbleupnpserver:latest
    container_name: bubbleupnpserver
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/dri:/dev/dri                    # hardware transcoding
    volumes:
      - ./data/bubble:/data
    command: [ -dataDir, /data ]
